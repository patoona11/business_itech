{% extends 'layout.html' %}
{% block content %}
<h2>✍️ ใบสำคัญบันทึกบัญชี (Journal Voucher)</h2>
<hr>
<div class="card p-4">
    <form action="/journal" method="POST" id="jvForm">
        <div class="row mb-3">
            <div class="col-md-2">
                <label>เลขที่เอกสาร</label>
                <input type="text" name="doc_no" class="form-control" value="{{ next_doc_no }}" required>
            </div>
            <div class="col-md-2">
                <label>วันที่</label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label>อ้างอิงเอกสาร (Ref.)</label>
                <input type="text" name="reference" class="form-control" placeholder="เช่น INV-001">
            </div>
            <div class="col-md-3">
                <label>คำอธิบายรายการ</label>
                <input type="text" name="description" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label>สถานะ</label>
                <select name="status" class="form-select">
                    <option value="1">ปกติ (Open)</option>
                    <option value="2">ปิดบัญชี (Closed)</option>
                </select>
            </div>
        </div>
        
        <table class="table table-bordered mt-4" id="txTable">
            <thead class="table-light">
                <tr>
                    <th width="30%">รหัสบัญชี</th>
                    <th width="20%">รหัสหน่วยงาน</th>
                    <th width="20%" class="text-center">เดบิต (Dr)</th>
                    <th width="20%" class="text-center">เครดิต (Cr)</th>
                    <th width="10%"></th>
                </tr>
            </thead>
            <tbody>
                <!-- default 2 rows -->
                {% for i in range(2) %}
                <tr>
                    <td>
                        <select name="account_code[]" class="form-select select2">
                            <option value=""></option>
                            {% for a in accounts %}
                            <option value="{{ a.code }}">{{ a.code }} - {{ a.name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <select name="dept_code[]" class="form-select">
                            <option value="">- เลือกหน่วยงาน -</option>
                            {% for d in departments %}
                            <option value="{{ d.code }}">{{ d.code }} - {{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" step="0.01" name="debit[]" class="form-control dr-input" onkeyup="calcTotals()"></td>
                    <td><input type="number" step="0.01" name="credit[]" class="form-control cr-input" onkeyup="calcTotals()"></td>
                    <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">ลบ</button></td>
                </tr>
                {% endfor %}
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="2" class="text-end">รวม:</th>
                    <th class="text-center" id="totalDr">0.00</th>
                    <th class="text-center" id="totalCr">0.00</th>
                    <th></th>
                </tr>
            </tfoot>
        </table>
        
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button type="button" class="btn btn-secondary" onclick="addRow()">+ เพิ่มบรรทัด</button>
            <button type="submit" class="btn btn-success btn-lg px-5 shadow-sm" onclick="return validateJV()">💾 บันทึกรายการ</button>
        </div>
    </form>
</div>

<!-- Template for new row -->
<table id="rowTemplate" style="display:none;">
    <tr>
        <td>
            <select name="account_code[]" class="form-select select2">
                <option value=""></option>
                {% for a in accounts %}
                <option value="{{ a.code }}">{{ a.code }} - {{ a.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td>
            <select name="dept_code[]" class="form-select">
                <option value="">- เลือกหน่วยงาน -</option>
                {% for d in departments %}
                <option value="{{ d.code }}">{{ d.code }} - {{ d.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td><input type="number" step="0.01" name="debit[]" class="form-control dr-input" onkeyup="calcTotals()"></td>
        <td><input type="number" step="0.01" name="credit[]" class="form-control cr-input" onkeyup="calcTotals()"></td>
        <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">ลบ</button></td>
    </tr>
</table>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        $('.select2').select2({
            placeholder: "- เลือกบัญชี -",
            allowClear: true,
            width: '100%'
        });
    });

    document.querySelector('input[name="date"]').valueAsDate = new Date();

    function addRow() {
        var tbody = document.querySelector('#txTable tbody');
        var template = document.querySelector('#rowTemplate tbody').innerHTML;
        tbody.insertAdjacentHTML('beforeend', template);
        
        // Re-initialize select2 for new rows
        $('#txTable tbody tr:last-child .select2').select2({
            placeholder: "- เลือกบัญชี -",
            allowClear: true,
            width: '100%'
        });
    }
    
    function removeRow(btn) {
        btn.closest('tr').remove();
        calcTotals();
    }
    
    function calcTotals() {
        let drs = document.querySelectorAll('.dr-input');
        let crs = document.querySelectorAll('.cr-input');
        let tDr = 0, tCr = 0;
        
        drs.forEach(i => { tDr += parseFloat(i.value) || 0; });
        crs.forEach(i => { tCr += parseFloat(i.value) || 0; });
        
        document.getElementById('totalDr').innerText = tDr.toFixed(2);
        document.getElementById('totalCr').innerText = tCr.toFixed(2);
        
        if(tDr === tCr && tDr > 0) {
            document.getElementById('totalDr').style.color = 'green';
            document.getElementById('totalCr').style.color = 'green';
        } else {
            document.getElementById('totalDr').style.color = 'red';
            document.getElementById('totalCr').style.color = 'red';
        }
    }
    
    function validateJV() {
        let tDr = parseFloat(document.getElementById('totalDr').innerText);
        let tCr = parseFloat(document.getElementById('totalCr').innerText);
        
        if(tDr !== tCr) {
            alert('ยอด เดบิต และ เครดิต ต้องเท่ากัน!');
            return false;
        }
        if(tDr === 0) {
            alert('ต้องมียอดเดบิตและเครดิต');
            return false;
        }
        return true;
    }
</script>
{% endblock %}
