<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ITECH@BalanceX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0d7350 0%, #159f6d 100%); 
            font-family: 'Noto Sans Thai', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .login-card { 
            width: 420px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            border: none; 
            border-radius: 20px; 
            padding: 40px; 
            background: #ffffff; 
        }
        .btn-primary { background-color: #0d7350; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1.1rem; }
        .btn-primary:hover { background-color: #0a5c40; }
        .form-control { padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <span style="font-size: 4rem;">⛳</span>
            <h2 class="mt-2" style="color: #0d7350; font-weight: 600;">ITECH@BalanceX</h2>
            <p class="text-muted">กรุณาเข้าสู่ระบบเพื่อเริ่มใช้งาน</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="/login" method="POST">
            <div class="mb-3">
                <label>รหัสผ่านเข้าใช้งาน (Password)</label>
                <input type="password" name="password" class="form-control" placeholder="กรอกรหัสผ่าน" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
        </form>
    </div>
</body>
</html>
