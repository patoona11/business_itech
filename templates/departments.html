{% extends 'layout.html' %}
{% block content %}
<h2>🏢 จัดการหน่วยงาน</h2>
<hr>
<div class="row">
    <div class="col-md-4">
        <div class="card p-3 mb-4">
            <h4>เพิ่มหน่วยงานใหม่</h4>
            <form action="/departments" method="POST">
                <div class="mb-3">
                    <label>รหัสหน่วยงาน</label>
                    <input type="text" name="code" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>ชื่อหน่วยงาน</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">บันทึก</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <h4>รายชื่อหน่วยงาน</h4>
            <table class="table table-hover mt-3">
                <thead class="table-light">
                    <tr>
                        <th>รหัสหน่วยงาน</th>
                        <th>ชื่อหน่วยงาน</th>
                        <th width="150">จัดการ</th>
                    </tr>
                </thead>
                <tbody>
                    {% for dep in departments %}
                    <tr>
                        <td>{{ dep.code }}</td>
                        <td>{{ dep.name }}</td>
                        <td>
                            <!-- Edit Button -->
                            <button type="button" class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal{{ dep.code }}">แก้ไข</button>
                            <!-- Delete Button -->
                            <a href="/departments/delete/{{ dep.code }}" class="btn btn-sm btn-danger" onclick="return confirm('ยืนยันการลบหน่วยงานนี้?');">ลบ</a>
                        </td>
                    </tr>
                    
                    <!-- Edit Modal -->
                    <div class="modal fade" id="editModal{{ dep.code }}" tabindex="-1" aria-hidden="true">
                      <div class="modal-dialog">
                        <div class="modal-content">
                          <form action="/departments/edit/{{ dep.code }}" method="POST">
                              <div class="modal-header">
                                <h5 class="modal-title">แก้ไขหน่วยงาน {{ dep.code }}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                              </div>
                              <div class="modal-body">
                                <div class="mb-3">
                                    <label>ชื่อหน่วยงานใหม่</label>
                                    <input type="text" name="name" class="form-control" value="{{ dep.name }}" required>
                                </div>
                              </div>
                              <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                                <button type="submit" class="btn btn-primary">บันทึกการแก้ไข</button>
                              </div>
                          </form>
                        </div>
                      </div>
                    </div>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
